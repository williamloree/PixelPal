[package]
name = "pixelpal"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
iroh = "1.5.0"
iroh-mdns-address-lookup = "0.6.1"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
